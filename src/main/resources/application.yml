spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000



jwt:
  secret: ${JWT_SECRET:sdp1617-local-dev-jwt-secret-key-please-change-1234567890abcdef}
  access-expiration: 3600000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    logo-url: ${MAIL_LOGO_URL:https://sdp-funzy.s3.ap-northeast-2.amazonaws.com/static/funzy-logo.png}
  support:
    terms-of-service-url: ${TERMS_OF_SERVICE_URL:https://sdp1617.example.com/terms}
    privacy-policy-url: ${PRIVACY_POLICY_URL:https://sdp1617.example.com/privacy}
  social:
    max-follow-count: ${MAX_FOLLOW_COUNT:50}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:sdp-funzy}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    stack:
      auto: false

google:
  client-id: ${GOOGLE_CLIENT_ID:68223418406-g2sdcb7dj9kl8rnl2emp1eg8kfbp08el.apps.googleusercontent.com}

# Swagger UI 태그를 가나다순으로 정렬한다 — "편지 ① 쓰기 → ② 보내기·편지함 → ③ 반응"이 흐름 순서대로 붙어 보이게
springdoc:
  swagger-ui:
    tags-sorter: alpha
