spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000



jwt:
  secret: ${JWT_SECRET:sdp1617-local-dev-jwt-secret-key-please-change-1234567890abcdef}
  access-expiration: 3600000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    # 브라우저에서 API를 호출할 수 있는 프론트 주소, 쉼표로 구분 (#154). 경로 없이 scheme·host(·port)만
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    logo-url: ${MAIL_LOGO_URL:https://sdp-funzy.s3.ap-northeast-2.amazonaws.com/static/funzy-logo.png}
  # 웹 푸시 (#89). 운영 .env에 VAPID 키를 넣고 PUSH_ENABLED=true로 켠다. 꺼져 있으면 구독은 저장하되 발송하지 않는다.
  # 키 만들기: npx web-push generate-vapid-keys (공개키·비밀키 모두 base64url). 키를 바꾸면 기존 구독은 모두 다시 해야 한다.
  push:
    enabled: ${PUSH_ENABLED:false}
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:${app.frontend-url}}  # 푸시 서비스가 문제 시 연락할 곳 (mailto: 또는 https URL)
    ttl: 1d                                        # 브라우저가 꺼져 있을 때 푸시 서비스가 보관하는 기간
    # 서버가 요청을 보내도 되는 브라우저 푸시 서비스 (이 도메인이거나 하위 도메인인 https 주소만 구독으로 받는다)
    allowed-endpoint-hosts:
      - fcm.googleapis.com          # 크롬·엣지(일부)·삼성 인터넷 등
      - push.services.mozilla.com   # 파이어폭스
      - push.apple.com              # 사파리 (iOS는 홈 화면에 추가한 웹앱)
      - notify.windows.com          # 엣지
  social:
    max-follow-count: ${MAX_FOLLOW_COUNT:50}
  # 매일 새벽 4시 정리 작업 (#122). 실제 운영 서버의 .env에서만 CLEANUP_ENABLED=true로 켠다.
  # 로컬(docker compose의 prod 프로필 포함)도 기본값으로 운영과 같은 S3 버킷을 쓰므로, 로컬 DB 기준으로 정리하면
  # 운영 사진을 "안 쓰는 사진"으로 보고 지울 수 있다. 그래서 프로필이 아니라 서버 환경변수로만 켠다.
  cleanup:
    enabled: ${CLEANUP_ENABLED:false}
    image-grace-period: 1d          # 올린 지 1일이 안 된 사진은 지우지 않음 (사진을 올리고 카드를 저장하기 전 사이)
    notification-retention: 30d     # 만든 지 30일이 지난 알림 삭제
    unsent-letter-retention: 90d    # 마지막 수정 후 90일이 지난 보내지 않은 편지 삭제

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:sdp-funzy}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    stack:
      auto: false

google:
  client-id: ${GOOGLE_CLIENT_ID:68223418406-g2sdcb7dj9kl8rnl2emp1eg8kfbp08el.apps.googleusercontent.com}

# Swagger 태그는 정렬하지 않는다(tags-sorter 없음) — OpenApiConfig에 적은 순서(가입 → 친구 → 편지 → 아카이브 → 마이페이지)대로 보여준다
springdoc:
  default-produces-media-type: application/json
