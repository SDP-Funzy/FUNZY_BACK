spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000



jwt:
  secret: ${JWT_SECRET:sdp1617-local-dev-jwt-secret-key-please-change-1234567890abcdef}
  access-expiration: 3600000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    logo-url: ${MAIL_LOGO_URL:https://sdp-funzy.s3.ap-northeast-2.amazonaws.com/static/funzy-logo.png}
  support:
    terms-of-service-url: ${TERMS_OF_SERVICE_URL:https://sdp1617.example.com/terms}
    privacy-policy-url: ${PRIVACY_POLICY_URL:https://sdp1617.example.com/privacy}
  social:
    max-follow-count: ${MAX_FOLLOW_COUNT:50}
  # 매일 새벽 4시 정리 작업 (#122). 실제 운영 서버의 .env에서만 CLEANUP_ENABLED=true로 켠다.
  # 로컬(docker compose의 prod 프로필 포함)도 기본값으로 운영과 같은 S3 버킷을 쓰므로, 로컬 DB 기준으로 정리하면
  # 운영 사진을 "안 쓰는 사진"으로 보고 지울 수 있다. 그래서 프로필이 아니라 서버 환경변수로만 켠다.
  cleanup:
    enabled: ${CLEANUP_ENABLED:false}
    image-grace-period: 1d          # 올린 지 1일이 안 된 사진은 지우지 않음 (사진을 올리고 카드를 저장하기 전 사이)
    notification-retention: 30d     # 만든 지 30일이 지난 알림 삭제
    unsent-letter-retention: 90d    # 마지막 수정 후 90일이 지난 보내지 않은 편지 삭제

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:sdp-funzy}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    stack:
      auto: false

google:
  client-id: ${GOOGLE_CLIENT_ID:68223418406-g2sdcb7dj9kl8rnl2emp1eg8kfbp08el.apps.googleusercontent.com}

# Swagger UI 태그를 가나다순으로 정렬한다 — "편지 ① 쓰기 → ② 보내기·편지함 → ③ 반응"이 흐름 순서대로 붙어 보이게
springdoc:
  swagger-ui:
    tags-sorter: alpha
