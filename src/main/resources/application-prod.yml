spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sdp1617}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:sdp-funzy}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
    stack:
      auto: false

google:
  client-id: ${GOOGLE_CLIENT_ID}

server:
  # caddy(리버스 프록시)가 붙여준 X-Forwarded-For / X-Forwarded-Proto를 신뢰해 실제 사용자 IP와 https 여부를 인식한다.
  # 이게 없으면 모든 요청 IP가 caddy 컨테이너 IP가 되어 IP 기준 로그인 잠금·rate limit이 전체 사용자 공용이 된다.
  # (native = Tomcat RemoteIpValve: 사설 대역(10/8, 172.16/12, 192.168/16 등)의 프록시만 신뢰 → docker 네트워크의 caddy 포함)
  forward-headers-strategy: native
