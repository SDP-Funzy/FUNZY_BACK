name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check if this is the latest commit on develop
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/git/refs/heads/develop --jq .object.sha)
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$HEAD_SHA" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${HEAD_SHA}는 develop의 최신 커밋(${LATEST})이 아니라 배포를 건너뜁니다"
          fi

      - name: Checkout
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up JDK 21
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.check.outputs.is_latest == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build jar
        if: steps.check.outputs.is_latest == 'true'
        run: chmod +x gradlew && ./gradlew bootJar -x test

      - name: Copy files to EC2
        if: steps.check.outputs.is_latest == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,caddy/Caddyfile,.dockerignore,build/libs/*.jar"
          target: "~/app"

      - name: Re-check freshness right before deploy
        id: recheck
        if: steps.check.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/git/refs/heads/develop --jq .object.sha)
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$HEAD_SHA" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::빌드/전송 도중 더 최신 커밋(${LATEST})이 올라와서 배포를 건너뜁니다"
          fi

      - name: Deploy on EC2
        if: steps.check.outputs.is_latest == 'true' && steps.recheck.outputs.is_latest == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app
            docker compose --profile prod up -d --build
            # Caddyfile이 바뀌었어도 caddy 컨테이너는 재생성되지 않으므로 설정을 다시 읽게 한다 (문법 오류면 배포 실패)
            docker compose --profile prod exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
            for i in $(seq 1 30); do curl -sf --connect-timeout 3 --max-time 5 http://localhost:8080/health && break; sleep 2; done
            curl -sf --connect-timeout 3 --max-time 5 http://localhost:8080/health || { echo "배포 후 헬스체크 실패"; exit 1; }
            # 외부 경로(caddy + HTTPS 인증서)까지 확인. 첫 배포는 인증서 발급에 시간이 걸릴 수 있어 넉넉히 기다린다.
            # --resolve로 서버 자신의 caddy(443)에 붙되, 인증서는 실제 도메인 기준으로 검증한다.
            for i in $(seq 1 30); do curl -sf --connect-timeout 3 --max-time 5 --resolve api.funzy.kr:443:127.0.0.1 https://api.funzy.kr/health && break; sleep 2; done
            curl -sf --connect-timeout 3 --max-time 5 --resolve api.funzy.kr:443:127.0.0.1 https://api.funzy.kr/health || { echo "HTTPS(caddy) 헬스체크 실패 — docker logs sdp1617-caddy 확인"; exit 1; }
