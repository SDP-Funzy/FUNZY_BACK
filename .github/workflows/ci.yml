name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sdp1617
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # refresh token 체인 교체(Lua) 등 Redis 스크립트를 실제 Redis로 검증하는 통합 테스트용
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: prod,ci
          CLEANUP_ENABLED: "false"
          JWT_SECRET: ci-only-jwt-secret-key-not-used-in-production-1234567890
          FRONTEND_URL: https://ci-placeholder.sdp1617.example.com
          GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          AWS_REGION: ap-northeast-2
        run: ./gradlew build
